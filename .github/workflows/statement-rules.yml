name: Statement rules (by hand)
# Run by hand only. Saves rules for bank statement lines (a person or words → a holding, a loan, spending…), then brings the loans the
# statements built up to date. "plan" writes nothing; "apply" saves them and rebuilds the movements.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan (write nothing) or apply
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      rules:
        description: the rules, as a JSON list (see workers/src/statement-rules.ts)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bank-statements-import
  cancel-in-progress: false
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://imrrsvpqdazjojeescwl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODE: ${{ inputs.mode }}
      RULES: ${{ inputs.rules }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fwos/workers statement-rules
