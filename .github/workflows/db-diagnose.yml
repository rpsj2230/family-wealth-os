name: Database check (read-only)
# Manual: prints row counts and basic state of the live database. Changes nothing; shows no secrets or balances.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Counts
        run: |
          url="$(scripts/db-url.sh)"
          psql "$url" -v ON_ERROR_STOP=0 <<'SQL'
          select 'households' as what, count(*) from public.households
          union all select 'household_members', count(*) from public.household_members
          union all select 'auth users', count(*) from auth.users
          union all select 'owners', count(*) from public.owners
          union all select 'assets', count(*) from public.assets;
          select email, created_at::date as created, last_sign_in_at::date as last_login from auth.users;
          select m.role, m.household_id is not null as has_household, u.email from public.household_members m join auth.users u on u.id = m.user_id;
          select proname, prosecdef as security_definer from pg_proc where proname in ('create_household','is_member','is_admin') and pronamespace = 'public'::regnamespace;
          select grantee, privilege_type from information_schema.routine_privileges where routine_name = 'create_household' and routine_schema = 'public';
          select polname, polcmd from pg_policy where polrelid = 'public.household_members'::regclass;
          \echo '== funds by option (growth / IDCW), counts only'
          select coalesce(s.option, case when p.fund_name ~* 'idcw|dividend' then 'IDCW (by name)' else 'unknown' end) as option, count(*)
            from public.mf_positions p left join public.amfi_schemes s on s.code = p.amfi_code group by 1 order by 1;
          \echo '== fund statement lines by kind, counts only'
          select kind, count(*) from public.mf_transactions group by 1 order by 1;
          \echo '== statement lines classed "other": description pattern (digits masked), sign of units and amount, count'
          select regexp_replace(regexp_replace(lower(left(description, 45)), '[0-9]', '#', 'g'), '[a-z]{2,}[0-9#]{4,}', '…', 'g') as pattern,
                 sign(units) as units_sign, sign(amount) as amount_sign, count(*)
            from public.mf_transactions where kind = 'other' group by 1, 2, 3 order by 4 desc limit 20;
          \echo '== mutual fund records: owner, name, status, where it came from, statement lines (no amounts)'
          select o.display_name as owner, a.nickname, p.fund_name, a.status, p.provenance, a.created_at::date as created,
                 (select count(*) from public.mf_transactions t where t.asset_id = a.id) as lines,
                 (select string_agg(distinct t.source, ',') from public.mf_transactions t where t.asset_id = a.id) as line_sources,
                 p.amfi_code is not null as scheme_matched,
                 p.invested > 0 as has_invested,
                 (select count(*) from public.observations ob where ob.asset_id = a.id and ob.superseded_by is null) as values_on_file,
                 (select max(ob.as_of) from public.observations ob where ob.asset_id = a.id and ob.superseded_by is null) as latest_value_on
            from public.assets a join public.owners o on o.id = a.owner_id
            left join public.mf_positions p on p.asset_id = a.id
           where a.type = 'mutual_fund' order by o.display_name, coalesce(p.fund_name, a.nickname);
          \echo '== fund statements imported, counts only'
          select outcome, count(*) from public.cas_imports group by 1 order by 1;
          SQL
