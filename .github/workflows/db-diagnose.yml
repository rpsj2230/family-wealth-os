name: Database check (read-only)
# Manual: prints row counts and basic state of the live database. Changes nothing; shows no secrets or balances.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Counts
        run: |
          url="$(scripts/db-url.sh)"
          psql "$url" -v ON_ERROR_STOP=0 <<'SQL'
          select 'households' as what, count(*) from public.households
          union all select 'household_members', count(*) from public.household_members
          union all select 'auth users', count(*) from auth.users
          union all select 'owners', count(*) from public.owners
          union all select 'assets', count(*) from public.assets;
          select email, created_at::date as created, last_sign_in_at::date as last_login from auth.users;
          select m.role, m.household_id is not null as has_household, u.email from public.household_members m join auth.users u on u.id = m.user_id;
          select proname, prosecdef as security_definer from pg_proc where proname in ('create_household','is_member','is_admin') and pronamespace = 'public'::regnamespace;
          select grantee, privilege_type from information_schema.routine_privileges where routine_name = 'create_household' and routine_schema = 'public';
          select polname, polcmd from pg_policy where polrelid = 'public.household_members'::regclass;
          \echo '== funds by option (growth / IDCW), counts only'
          select coalesce(s.option, case when p.fund_name ~* 'idcw|dividend' then 'IDCW (by name)' else 'unknown' end) as option, count(*)
            from public.mf_positions p left join public.amfi_schemes s on s.code = p.amfi_code group by 1 order by 1;
          \echo '== fund statement lines by kind, counts only'
          select kind, count(*) from public.mf_transactions group by 1 order by 1;
          \echo '== statement lines classed "other": description pattern (digits masked), sign of units and amount, count'
          select regexp_replace(regexp_replace(lower(left(description, 45)), '[0-9]', '#', 'g'), '[a-z]{2,}[0-9#]{4,}', '…', 'g') as pattern,
                 sign(units) as units_sign, sign(amount) as amount_sign, count(*)
            from public.mf_transactions where kind = 'other' group by 1, 2, 3 order by 4 desc limit 20;
          \echo '== mutual fund records: owner, name, status, where it came from, statement lines (no amounts)'
          select o.display_name as owner, a.nickname, p.fund_name, a.status, p.provenance, a.created_at::date as created,
                 (select count(*) from public.mf_transactions t where t.asset_id = a.id) as lines,
                 (select string_agg(distinct t.source, ',') from public.mf_transactions t where t.asset_id = a.id) as line_sources,
                 p.amfi_code is not null as scheme_matched,
                 p.invested > 0 as has_invested,
                 (select count(*) from public.observations ob where ob.asset_id = a.id and ob.superseded_by is null) as values_on_file,
                 (select max(ob.as_of) from public.observations ob where ob.asset_id = a.id and ob.superseded_by is null) as latest_value_on
            from public.assets a join public.owners o on o.id = a.owner_id
            left join public.mf_positions p on p.asset_id = a.id
           where a.type = 'mutual_fund' order by o.display_name, coalesce(p.fund_name, a.nickname);
          \echo '== fund records with no statement lines: other funds of the same person whose values match on the same dates (ratios only, no amounts)'
          with v as (
            select ob.asset_id, ob.as_of, ob.amount
              from public.observations ob join public.assets a on a.id = ob.asset_id
             where a.type = 'mutual_fund' and ob.superseded_by is null and ob.amount > 0
          ), bare as (
            select a.id, a.owner_id, a.nickname from public.assets a
             where a.type = 'mutual_fund' and not exists (select 1 from public.mf_transactions t where t.asset_id = a.id)
          )
          select b.nickname as no_lines, o.nickname as other, count(*) as same_dates,
                 round(avg(v2.amount / v1.amount), 2) as avg_ratio,
                 sum(case when abs(v2.amount / v1.amount - 1) < 0.02 then 1 else 0 end) as within_2pct
            from bare b join v v1 on v1.asset_id = b.id
            join public.assets o on o.owner_id = b.owner_id and o.type = 'mutual_fund' and o.id <> b.id
            join v v2 on v2.asset_id = o.id and v2.as_of = v1.as_of
           group by 1, 2 having sum(case when abs(v2.amount / v1.amount - 1) < 0.10 then 1 else 0 end) > 0
           order by 1, 5 desc;
          \echo '== Rupash funds: statement lines by kind, with first and last date (no amounts)'
          select a.nickname, t.kind, count(*) as lines, min(t.txn_on) as first_on, max(t.txn_on) as last_on
            from public.mf_transactions t join public.assets a on a.id = t.asset_id join public.owners o on o.id = a.owner_id
           where o.display_name = 'Rupash' group by 1, 2 order by 1, 2;
          \echo '== Rupash statement lines that mention a switch or another plan (descriptions, digits masked)'
          select a.nickname, t.kind, t.txn_on, regexp_replace(left(t.description, 90), '[0-9]', '#', 'g') as description
            from public.mf_transactions t join public.assets a on a.id = t.asset_id join public.owners o on o.id = a.owner_id
           where o.display_name = 'Rupash' and (t.kind in ('switch_in','switch_out','redeem') or t.description ~* 'switch|regular|stp|transfer')
           order by 1, 3 limit 60;
          \echo '== Rupash funds with no statement lines: their value readings (dates, sources, how many distinct values; no amounts)'
          select a.nickname, ob.source, count(*) as readings, min(ob.as_of) as first_on, max(ob.as_of) as last_on,
                 count(distinct round(ob.amount)) as distinct_values
            from public.observations ob join public.assets a on a.id = ob.asset_id join public.owners o on o.id = a.owner_id
           where o.display_name = 'Rupash' and a.type = 'mutual_fund' and ob.superseded_by is null
             and not exists (select 1 from public.mf_transactions t where t.asset_id = a.id)
           group by 1, 2 order by 1, 2;
          \echo '== Rupash funds with no statement lines: was there value before the Direct plan began, and how it moved (ratios only)'
          with r as (
            select a.nickname, ob.as_of, ob.amount,
                   row_number() over (partition by a.id order by ob.as_of) as n,
                   row_number() over (partition by a.id order by ob.as_of desc) as m
              from public.observations ob join public.assets a on a.id = ob.asset_id join public.owners o on o.id = a.owner_id
             where o.display_name = 'Rupash' and a.type = 'mutual_fund' and ob.superseded_by is null
               and not exists (select 1 from public.mf_transactions t where t.asset_id = a.id)
          )
          select f.nickname, f.as_of as first_on, f.amount > 0 as value_on_first_day, l.as_of as last_on,
                 round(l.amount / nullif(f.amount, 0), 2) as last_over_first
            from r f join r l on l.nickname = f.nickname and l.m = 1 where f.n = 1 order by 1;
          \echo '== fund import choices left aside (verdict and basis), by fund'
          select a.nickname, i.verdict, i.basis from public.fund_import_ignores i join public.assets a on a.id = i.asset_id order by 1;
          \echo '== fund statements imported, counts only'
          select outcome, count(*) from public.cas_imports group by 1 order by 1;
          SQL
