name: Numbers check (read-only)
# Manual: works out the household's headline figures from the live database with the same code the portal and the e-mail use and prints them with
# the checks that tie them together. Reads only; prints totals (no account names or numbers). The log is visible to people with access to this repository.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://imrrsvpqdazjojeescwl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fwos/workers numbers-check
