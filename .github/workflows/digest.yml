name: Daily summary email
# About 4:00 AM Singapore time every day (scheduled 3:53). Only households that switched it on in the app (Settings) receive anything.
on:
  schedule:
    # 3:53 AM Singapore (19:53 UTC): every fund price of the day just ended is out by then (a fund's price is set once a day and
    # published by about 11 PM India time, 1:30 AM Singapore). Off the hour, because GitHub starts jobs set on the hour latest.
    - cron: '53 19 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Digest test: send one [Test] e-mail to the people who can sign in, without using up today’s summary'
        type: boolean
        default: false
      inactivity_dry_run:
        description: 'Inactivity alert: only log what it would send (nothing is sent or recorded)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: digest
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://imrrsvpqdazjojeescwl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      APP_URL: https://family-wealth-os-nine.vercel.app
      DIGEST_TEST: ${{ inputs.test }}
      INACTIVITY_DRY_RUN: ${{ inputs.inactivity_dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          missing=""
          for v in SUPABASE_SERVICE_ROLE_KEY SMTP_USER SMTP_APP_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing (docs/NEEDS-FROM-YOU.md A8)"; exit 1; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the newest fund prices first, so "Today's change" uses the latest the fund houses have published, however late the run starts
      - name: Refresh fund prices
        run: pnpm --filter @fwos/workers market-data
        continue-on-error: true
      - run: pnpm --filter @fwos/workers digest
