name: Transfers from Singapore
# Run by hand only. The transfers are this run's input (base64 JSON), never stored in the repository. "plan" writes nothing; "apply"
# stores them, works out the account each reached and writes the ledger's movements. The log shows counts, totals and bank names only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan (write nothing) or apply
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      payload:
        description: the transfers, base64 JSON
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: wise-import
  cancel-in-progress: false
jobs:
  wise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://imrrsvpqdazjojeescwl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODE: ${{ inputs.mode }}
      REMIT_B64: ${{ inputs.payload }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fwos/workers wise
