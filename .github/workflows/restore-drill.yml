name: Restore drill
# Once a month (and on demand) proves that a backup made the way the nightly job makes it can be restored, table by table.
# Uses only invented data and a throwaway key; it needs no secrets. The real backup can only be opened with your private key.
on:
  schedule:
    - cron: '0 3 5 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: restore-drill
  cancel-in-progress: false
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Restore drill
        run: scripts/restore-drill.sh
